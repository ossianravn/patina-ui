# The static site behind Dokploy's Traefik, which terminates TLS. Pages are directories (/docs/index.html) addressed
# without a trailing slash, as astro.config.mjs builds them; hashed assets cache for a year, pages revalidate.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;
  server_tokens off;

  # One address: www goes to the apex.
  if ($host ~* ^www\.(.+)$) {
    return 301 https://$1$request_uri;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  error_page 404 /404.html;

  # /docs/ -> /docs, so every page has one URL.
  rewrite ^/(.+)/$ /$1 permanent;

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }

  # The shadcn registry: the CLI fetches it from anywhere, so any origin may read it.
  location /r/ {
    add_header Cache-Control "public, max-age=300";
    add_header Access-Control-Allow-Origin "*";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    try_files $uri $uri/index.html =404;
  }
}
